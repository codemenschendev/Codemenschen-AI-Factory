name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:pricing
      - run: npm run build --workspace apps/web

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
      - run: composer install --no-interaction --prefer-dist
        working-directory: apps/api
      - run: cp .env.example .env && php artisan key:generate
        working-directory: apps/api
      # PageAuditTest drives a real browser through tools/qa-page.cjs. Without playwright-core
      # the tests skip, and without a headless shell eleven of them fail.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix tools ci --omit=dev && npx --prefix tools playwright-core install --with-deps chromium-headless-shell
        working-directory: apps/api
      - run: php artisan test
        working-directory: apps/api
