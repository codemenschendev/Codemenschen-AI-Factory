# AI Factory — production stack on the codemenschen.at server.
# Everything binds to 127.0.0.1; Apache terminates TLS and reverse-proxies
# (see infra/apache/). Host ports chosen to avoid the services already
# running on this box (3003, 4000, 5001, 6379, 3306, 27017, 18789).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_factory
      POSTGRES_USER: ai_factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6380:6379"

  api:
    build:
      context: ../apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file: [../apps/api/.env]
    depends_on: [postgres, redis]
    ports:
      - "127.0.0.1:8181:8000"
    volumes:
      - artifacts:/artifacts
      # Marketing clips. The API only serves them, so read-only here; horizon renders and
      # therefore mounts the same directory writable.
      - /var/appwerk-media/videos:/media/videos:ro
      - /var/appwerk-media/uploads:/media/uploads
      # The photo library. Writable here because the operator marks, renames and deletes
      # entries from the admin panel; ops/library.sh works the same files from the host.
      - /var/appwerk-media/library:/media/library
      # Design references. Read-only for the API: it lists and deletes through the panel, but
      # nothing here is ever served, so it never needs to hand a file to anyone.
      - /var/appwerk-media/design-refs:/media/design-refs

  horizon:
    build:
      context: ../apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    env_file: [../apps/api/.env]
    depends_on: [postgres, redis]
    volumes:
      - artifacts:/artifacts
      # RenderProjectVideo runs here: it writes the finished clip and needs the scratch dir.
      - /var/appwerk-media/videos:/media/videos
      - /var/appwerk-media/uploads:/media/uploads
      # RenderProjectAd both reads from the library and files new photos into it.
      - /var/appwerk-media/library:/media/library
      # BuildPrototype shows one of these to the model while it writes.
      - /var/appwerk-media/design-refs:/media/design-refs:ro

  scheduler:
    build:
      context: ../apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file: [../apps/api/.env]
    depends_on: [postgres, redis]

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
      args:
        WORKER_UID: ${WORKER_UID:?set in infra/.env}
        WORKER_GID: ${WORKER_GID:?set in infra/.env}
    restart: unless-stopped
    # Host network: the OpenClaw gateway listens on the host loopback only
    # (127.0.0.1:18789). The worker binds to the docker-bridge IP so only
    # containers (api/horizon) can reach it, never the internet.
    network_mode: host
    # Non-root: same uid as the host's openclaw user (shared repos + auth dir).
    user: "${WORKER_UID:?set in infra/.env}:${WORKER_GID:?set in infra/.env}"
    environment:
      HOME: /home/worker
      # Gateway IP of the compose network (infra_default) — only api/horizon reach it
      BIND: ${WORKER_BIND:-172.28.0.1}
      PORT: 8300
      AGENT_MODE: ${AGENT_MODE:-}
      # OpenClaw gateway on the host loopback — all AI stages reuse its session
      OPENCLAW_GATEWAY_URL: ${OPENCLAW_GATEWAY_URL:-http://127.0.0.1:18789}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_GATEWAY_MODEL: ${OPENCLAW_GATEWAY_MODEL:-openclaw/main}
      # Host relay → `openclaw agent` with tools (coding/fix). Loopback, host network.
      OPENCLAW_RELAY_URL: ${OPENCLAW_RELAY_URL:-http://127.0.0.1:8310}
      OPENCLAW_RELAY_TOKEN: ${OPENCLAW_RELAY_TOKEN:-}
      REPOS_HOST_PATH: /var/www/ai-factory/infra/repos
      WORKER_TOKEN: ${WORKER_TOKEN:?set in infra/.env}
      REPOS_PATH: /repos
      ARTIFACTS_PATH: /artifacts
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # EAS Build (Expo stack): unset → release ships the source bundle only
      EXPO_TOKEN: ${EXPO_TOKEN:-}
      EXPO_OWNER: ${EXPO_OWNER:-}
      EAS_PROFILE: ${EAS_PROFILE:-preview}
    volumes:
      # Host bind (not a named volume): OpenClaw's agent works on these repos
      # directly on the host with its own tools — same uid (openclaw).
      - ./repos:/repos
      - artifacts:/artifacts
      # Writable home for the Claude runtime's own state…
      - ./worker-home:/home/worker
      # …and the host's Claude subscription auth dir (same account as the
      # OpenClaw gateway). Mounted rw so the runtime can refresh the access
      # token with the long-lived refresh token; same uid as the host user.
      - /home/openclaw/.claude:/home/worker/.claude

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.appwerk.codemenschen.at
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
    depends_on: [api]
    ports:
      - "127.0.0.1:3105:3000"

volumes:
  pgdata:
  redisdata:
  repos:
  artifacts:
