# The customer console (config/console.php), on the same Next.js container: proxy.ts
# tells it apart by the host and serves only the customer pages. Set CONSOLE_URL in the API .env
# so sign-in links land here. Never indexed.
# Install: copy to /etc/apache2/sites-available/, a2ensite, then
#   certbot --apache -d console.appmitki.com
<VirtualHost *:80>
    ServerName console.appmitki.com
    ProxyPreserveHost On
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header unset X-Powered-By
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set X-Robots-Tag "noindex, nofollow"
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /api/ http://127.0.0.1:8181/api/
    ProxyPassReverse /api/ http://127.0.0.1:8181/api/
    ProxyPass / http://127.0.0.1:3105/
    ProxyPassReverse / http://127.0.0.1:3105/
    ErrorLog ${APACHE_LOG_DIR}/console_error.log
    CustomLog ${APACHE_LOG_DIR}/console_access.log combined
</VirtualHost>
