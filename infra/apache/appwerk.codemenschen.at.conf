# The old storefront address. Since 2026-09-29 the storefront lives on appmitki.com
# (appmitki.com.conf); every path here answers with a permanent redirect to the same path
# there, so share links, magic links in old mails and bookmarks keep working.
# The API (api.appwerk.codemenschen.at) and the console host are not redirected.
# Install: copy to /etc/apache2/sites-available/, a2ensite, then
#   certbot --apache -d appwerk.codemenschen.at
<VirtualHost *:80>
    ServerName appwerk.codemenschen.at
    RedirectMatch 301 ^/(.*)$ https://appmitki.com/$1
    ErrorLog ${APACHE_LOG_DIR}/appwerk_error.log
    CustomLog ${APACHE_LOG_DIR}/appwerk_access.log combined
</VirtualHost>
