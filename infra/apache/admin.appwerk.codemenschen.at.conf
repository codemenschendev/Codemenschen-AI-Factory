# Ops cockpit (Horizon dashboard etc.) — NEVER public: basic auth on top of
# app-level auth. Create the htpasswd file before enabling:
#   htpasswd -c /etc/apache2/.htpasswd-appwerk-admin patrick
<VirtualHost *:80>
    ServerName admin.appwerk.codemenschen.at
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8181/
    ProxyPassReverse / http://127.0.0.1:8181/
    <Location "/">
        AuthType Basic
        AuthName "AI Factory Admin"
        AuthUserFile /etc/apache2/.htpasswd-appwerk-admin
        Require valid-user
    </Location>
    ErrorLog ${APACHE_LOG_DIR}/appwerk_admin_error.log
    CustomLog ${APACHE_LOG_DIR}/appwerk_admin_access.log combined
</VirtualHost>
