# Sofabuilt (docs/specs/sofabuilt.md), the second brand on the same Next.js container: proxy.ts
# tells it apart by the host. Temporary address until sofabuilt.com is bought, then add it as
# ServerName/Alias here. Not indexed before launch (robots.txt says so too).
# Install: copy to /etc/apache2/sites-available/, a2ensite, then
#   certbot --apache -d sofabuilt.codemenschen.at
<VirtualHost *:80>
    ServerName sofabuilt.codemenschen.at
    ProxyPreserveHost On
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header unset X-Powered-By
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set X-Robots-Tag "noindex, nofollow"
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /api/ http://127.0.0.1:8181/api/
    ProxyPassReverse /api/ http://127.0.0.1:8181/api/
    ProxyPass / http://127.0.0.1:3105/
    ProxyPassReverse / http://127.0.0.1:3105/
    ErrorLog ${APACHE_LOG_DIR}/sofabuilt_error.log
    CustomLog ${APACHE_LOG_DIR}/sofabuilt_access.log combined
</VirtualHost>
