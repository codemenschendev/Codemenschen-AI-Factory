# The storefront (Appmitki, since 2026-09-29): the Next.js container (127.0.0.1:3105), with the
# same security headers the old host had. appwerk.codemenschen.at redirects here. The API stays on api.appwerk.codemenschen.at.
# Install: copy to /etc/apache2/sites-available/, a2ensite, then
#   certbot --apache -d appmitki.com -d www.appmitki.com
<VirtualHost *:80>
    ServerName appmitki.com
    ServerAlias www.appmitki.com
    ProxyPreserveHost On
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header unset X-Powered-By
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    # /api/ goes to the API container, so the signed links in e-mails can carry this domain
    # (MAIL_LINK_URL). The storefront itself still calls api.appwerk.codemenschen.at.
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /api/ http://127.0.0.1:8181/api/
    ProxyPassReverse /api/ http://127.0.0.1:8181/api/
    ProxyPass / http://127.0.0.1:3105/
    ProxyPassReverse / http://127.0.0.1:3105/
    ErrorLog ${APACHE_LOG_DIR}/appmitki_error.log
    CustomLog ${APACHE_LOG_DIR}/appmitki_access.log combined
</VirtualHost>
