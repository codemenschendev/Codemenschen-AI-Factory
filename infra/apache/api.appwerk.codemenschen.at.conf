# Factory API — proxies to the Laravel container (127.0.0.1:8181).
<VirtualHost *:80>
    ServerName api.appwerk.codemenschen.at
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8181/
    ProxyPassReverse / http://127.0.0.1:8181/
    ErrorLog ${APACHE_LOG_DIR}/appwerk_api_error.log
    CustomLog ${APACHE_LOG_DIR}/appwerk_api_access.log combined
</VirtualHost>
